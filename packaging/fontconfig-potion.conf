<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Process-local Mesquite configuration. It retains Kindle's normal font
     rules and adds only Potion's bundled Bionic Reading and emoji families. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir>/mnt/us/potion/share/potion/vendor/fast-font/fonts</dir>
  <dir>/mnt/us/potion/share/potion/vendor/noto-emoji/fonts</dir>
</fontconfig>
